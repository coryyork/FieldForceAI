name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production build (vite + server bundle)
        run: npm run build

  typecheck:
    # Informational until the ~81 pre-existing tsc errors are cleaned up.
    # Flip continue-on-error to false once `npm run check` is green on main.
    name: Typecheck (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: tsc --noEmit
        run: npm run check
